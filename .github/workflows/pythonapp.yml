
name: Multi-Cloud Continuous Integration

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.cloud }} - Python ${{ matrix.python-version }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:
          - cloud: Azure
            python-version: "3.11"
            install-command: make install

          - cloud: Google Cloud
            python-version: "3.12"
            install-command: make install-gcp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Display Python version
        run: python --version

      - name: Install dependencies
        run: ${{ matrix.install-command }}

      - name: Lint Python code
        run: make lint

      - name: Run automated tests
        run: make test

