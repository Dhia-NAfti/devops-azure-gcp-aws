
name: Multi-Cloud Continuous Integration

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.cloud }} - Python ${{ matrix.python-version }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:
          # Microsoft Azure
          - cloud: Azure
            python-version: "3.11"
            install-command: make install-azure

          # Google Cloud Platform
          - cloud: Google Cloud
            python-version: "3.12"
            install-command: make install-gcp

          # Amazon Web Services
          - cloud: AWS
            python-version: "3.13"
            install-command: make install-aws

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Display environment
        run: |
          echo "Cloud profile: ${{ matrix.cloud }}"
          python --version
          python -m pip --version

      - name: Install dependencies
        run: ${{ matrix.install-command }}

      - name: Lint Python code
        run: make lint

      - name: Run automated tests
        run: make test

